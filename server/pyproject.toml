[project]
name = "lamathek-server"
version = "2026.10.0"
description = "LaMathek API"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "authlib>=1.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "weasyprint>=62.0",
    "qrcode>=7.4",
    "gunicorn>=23.0",
]

[project.scripts]
lamathek = "lamathek.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lamathek*"]

[tool.setuptools.package-data]
lamathek = [
    "templates/**/*",
    "i18n/*.json",
    "static/**/*",
    "domain/*.json",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
